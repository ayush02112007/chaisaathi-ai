# ChaiSaathi AI — Render free-tier deployment
# No PostgreSQL: uses SQLite (no card required).
# Demo data is seeded automatically on every startup.

services:
  - type: web
    name: chaisaathi-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"
