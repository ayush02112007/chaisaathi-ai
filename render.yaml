databases:
  - name: chaisaathi-db
    databaseName: chaisaathi
    plan: free

services:
  - type: web
    name: chaisaathi-ai
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaisaathi-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"
